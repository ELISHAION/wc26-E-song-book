.st span{color:var(--ac);font-size:14px}

#greet .disc svg{width:28px;height:28px}
#greet .disc.on{background:color-mix(in srgb,var(--ac) 16%,transparent);box-shadow:0 0 0 1px var(--ac),0 0 18px -2px var(--ac)}
#greet .disc.on svg{animation:spin 2.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:899px){.nav{gap:0}.nav a{flex:1;min-width:0;padding:6px 2px}}
/* ===== Sunday Service card ===== */
.sc{--c-bg:#12303b;--c-cream:#e8d5a8;position:relative;margin:22px 0 4px;padding:24px 20px 20px;border-radius:30px;background:var(--c-bg);color:#fff;font-family:var(--sans);box-shadow:0 24px 60px -30px rgba(0,0,0,.9),0 0 0 1px rgba(232,213,168,.12)}
.sc-top{display:flex;align-items:center;gap:12px}
.sc-ico{width:36px;height:36px;color:var(--c-cream);flex:none;display:grid;place-items:center}.sc-ico svg{width:34px;height:34px}
.sc-kind{font-weight:800;font-size:clamp(19px,5.2vw,25px);letter-spacing:.01em;text-transform:uppercase;line-height:1.1}
.sc-new{margin-left:auto;padding:6px 14px;border-radius:99px;background:#0b4a2e;color:#1ddc74;font-weight:700;font-size:14px;letter-spacing:.05em}
.sc-date{margin:20px 0 6px;color:#e2cf9f;font-weight:600;letter-spacing:.02em;font-size:16px}
.sc-t{margin:0;font-size:clamp(27px,8vw,38px);line-height:1.18;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.sc-i{margin:12px 0 0;color:#c9d6db;font-size:17px;line-height:1.45;overflow-wrap:anywhere}
.sc-img{position:relative;margin:18px 0 0;border-radius:22px;overflow:hidden;aspect-ratio:16/9;background:#1b3a46}
.sc-img img{display:block;width:100%;height:100%;object-fit:cover}
.sc-chip{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);padding:8px 16px;border-radius:99px;background:rgba(18,14,12,.72);color:#fff;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sc-mic{display:flex;align-items:center;gap:12px;margin:18px 2px 14px;color:#fff;font-size:18px;text-decoration:none}
.sc-mic .mic{display:grid;place-items:center;width:28px;height:28px;color:#cfd8dc;flex:none}.sc-mic .mic svg{width:26px;height:26px}
.sc-mic .go{margin-left:auto;color:var(--c-cream);font-size:20px}
.sc-mic:hover>span:nth-child(2){text-decoration:underline;text-underline-offset:4px}
.sc-btn{display:block;width:100%;margin-top:16px;padding:18px 14px;border-radius:20px;border:0;background:linear-gradient(180deg,#eedfb9,#e3cf9e);color:#12303b;font:800 clamp(18px,5vw,21px)/1.2 var(--sans);text-align:center;cursor:pointer;transition:transform .15s,filter .2s}
.sc-mic+.sc-btn{margin-top:0}
.sc-btn:hover{filter:brightness(1.04)}.sc-btn:active{transform:scale(.98)}
/* ===== sermon summary: verses, numbered sections, notes, conclusion ===== */
.smw{scroll-margin-top:84px}
.smw>*{margin-top:18px}
.sm-s p:last-child{margin-bottom:.4em}
.vs{display:grid;gap:10px}
.vq{margin:0;padding:14px 16px 14px 18px;border-left:3px solid var(--ac);border-radius:4px 16px 16px 4px;background:var(--card);font-family:var(--serif);font-size:17px;line-height:1.6;overflow-wrap:anywhere}
.vq b{display:block;margin-bottom:4px;color:var(--ac);font-family:var(--sans);font-size:13px;letter-spacing:.08em}
.vq span{font-style:italic}
.sx{overflow:hidden;border:1px solid var(--bd);border-radius:20px;background:var(--card)}
.sx-h{display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(135deg,var(--ac2),var(--ac));color:var(--on,#0a0907)}
.sx-n{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.18);font:800 15px var(--sans)}
.sx-h h4{margin:0;font:700 clamp(17px,4.6vw,20px)/1.3 var(--serif);overflow-wrap:anywhere}
.sx-c{padding:14px 16px 12px}
.sx-c p{margin:0 0 .8em;font-family:var(--serif);font-size:17px;line-height:1.65;overflow-wrap:anywhere}
.sx-b{list-style:none;margin:0 0 .6em;padding:0}
.sx-b li{position:relative;padding:9px 0 9px 30px;border-top:1px solid var(--bd);font-family:var(--serif);font-size:17px;line-height:1.6;overflow-wrap:anywhere}
.sx-b li:first-child{border-top:0}
.sx-b li::before{content:"✓";position:absolute;left:0;top:9px;color:var(--ac);font:700 17px var(--sans)}
.sx-c .vq{margin:.2em 0 .8em}
.nt{display:flex;gap:10px;margin:.4em 0 .8em;padding:12px 14px;border:1px dashed var(--ac);border-radius:14px;background:color-mix(in srgb,var(--ac) 10%,transparent);font-family:var(--serif);font-size:17px;line-height:1.55;overflow-wrap:anywhere}
.nt>span:first-child{color:var(--ac)}
.sx.cl .sx-h{background:linear-gradient(135deg,#1d4c5b,#12303b);color:#e8d5a8}
.sx.cl .sx-n{background:rgba(232,213,168,.2)}
.sc-kind{overflow-wrap:anywhere}
