<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Lord's Church WC 2026 Songs eBook</title>
<meta name="description" content="Search and read lyrics anywhere. Works offline.">

<style>
:root{--bg:#0a0907;--bg2:#14141f;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.09);--tx:#f4f3fa;--mut:#9d9bb0;--ac:#a78bfa;--ac2:#f472b6;--r:20px;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--te:"Noto Sans Telugu","Nirmala UI","Gautami",var(--sans)}
[data-theme=light]{--bg:#f6f5fb;--bg2:#fff;--card:rgba(25,20,60,.05);--bd:rgba(25,20,60,.1);--tx:#16141f;--mut:#6b6980;--ac:#6d4aff;--ac2:#db2777}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;
background-image:radial-gradient(60vw 40vh at 85% -5%,color-mix(in srgb,var(--ac) 22%,transparent),transparent),radial-gradient(50vw 40vh at -5% 30%,color-mix(in srgb,var(--ac2) 12%,transparent),transparent);background-attachment:fixed}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:10px}
.col{max-width:1100px;margin:0 auto;padding:0 20px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;z-index:20;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:color-mix(in srgb,var(--bg) 70%,transparent)}
.brand{font-weight:800;letter-spacing:.2em;font-size:15px;white-space:nowrap;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.acts{display:flex;gap:8px}
.ib{height:42px;min-width:42px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;flex:none;font-size:14px;transition:transform .15s,background .2s}
.ib:hover{background:var(--bd)}.ib:active{transform:scale(.94)}
#off{position:sticky;top:64px;z-index:15;margin:6px 0;padding:10px 16px;border-radius:14px;font-size:13px;text-align:center;background:color-mix(in srgb,var(--ac) 18%,var(--bg2));border:1px solid var(--bd);color:var(--tx)}
#off[hidden]{display:none}
.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--bd)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut);padding:6px 14px;border-radius:14px;transition:color .2s}
.nav a b{font-size:20px;line-height:1;font-weight:400}
.nav a.on{color:var(--tx)}.nav a.on b{color:var(--ac)}
@media(min-width:900px){.nav{top:0;bottom:auto;right:auto;width:200px;flex-direction:column;justify-content:flex-start;gap:6px;padding:90px 14px;border:0;border-right:1px solid var(--bd)}
.nav a{flex-direction:row;gap:12px;font-size:15px;padding:12px 14px}.col{margin-left:200px;max-width:none;padding:0 48px 60px}.top{padding-top:22px}}
main{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.hero{padding:34px 0 20px}
.hero h1{font-size:clamp(44px,12vw,84px);letter-spacing:.14em;margin:0;font-weight:800;line-height:1}
.hero h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .tag{font-size:clamp(18px,4.5vw,26px);margin:12px 0 6px;font-weight:600}
.hero p{color:var(--mut);margin:0 0 22px;max-width:46ch;line-height:1.55;font-size:16px}
.sb{display:flex;align-items:center;gap:10px;height:58px;padding:0 18px;border-radius:18px;background:var(--card);border:1px solid var(--bd);transition:box-shadow .25s,border-color .25s;width:100%;max-width:640px}
.sb:focus-within{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent),0 10px 40px -10px var(--ac)}
.sb input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:17px}
.sb input::placeholder{color:var(--mut)}
h2{font-size:22px;margin:34px 0 14px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}@media(min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;display:flex;align-items:center;gap:14px;padding:12px;border-radius:var(--r);background:var(--card);border:1px solid var(--bd);transition:transform .2s,background .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);background:var(--bd);box-shadow:0 14px 40px -18px var(--ac)}
.card:active{transform:scale(.98)}
.art{flex:none;width:74px;height:74px;border-radius:16px;display:grid;place-items:center;font-size:30px;font-weight:700;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding-right:44px}
.meta b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--te)}
.meta small{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta i{font-style:normal;font-size:12px;color:var(--ac);font-weight:600}
.fav{position:absolute;right:8px;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mut);transition:transform .15s,color .2s}
.fav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.fav.on{color:var(--ac2)}.fav.on svg{fill:currentColor;animation:pop .35s}
@keyframes pop{40%{transform:scale(1.35)}}
.fav:active{transform:scale(.85)}
.rh .fav{position:static;margin:0;border:1px solid var(--bd);background:var(--card);border-radius:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{padding:9px 16px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:14px}
.chip:hover{border-color:var(--ac)}
.empty{text-align:center;padding:48px 20px;color:var(--mut);border:1px dashed var(--bd);border-radius:var(--r);line-height:1.6}
.empty .em{font-size:44px;display:block;margin-bottom:8px;filter:grayscale(.2)}
.empty b{display:block;color:var(--tx);font-size:19px;margin-bottom:4px}
.sk{height:98px;border-radius:var(--r);background:linear-gradient(100deg,var(--card) 30%,var(--bd) 50%,var(--card) 70%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.rh{display:flex;align-items:center;gap:12px;padding:6px 0 16px}
.rh .t{flex:1;min-width:0}.rh h1{font-size:clamp(22px,5vw,32px);margin:0;font-family:var(--te);line-height:1.25}.rh small{color:var(--mut);font-size:14px}
.tabs{display:inline-flex;padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--bd);margin:4px 0 8px}
.tabs button{padding:8px 16px;border-radius:10px;font-size:14px;color:var(--mut)}.tabs button.on{background:var(--ac);color:#fff}
.ly{max-width:640px;margin:18px auto 0;font-size:clamp(20px,5.2vw,26px);line-height:1.85;font-family:var(--te)}
.ly p{margin:0 0 2em}
#prog{position:fixed;top:0;left:0;height:3px;width:0;z-index:50;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:12px 20px;border-radius:14px;background:var(--bg2);border:1px solid var(--bd);z-index:60;font-size:14px;animation:in .25s}
#splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;color:#f4f3fa;transition:opacity .6s,transform .6s}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}.nosplash #splash{display:none}
#splash img{display:block;max-width:100%;height:auto}
#splash .ch{position:absolute;left:0;right:0;margin:0 auto;top:calc(50% - 60px);width:120px;height:120px}#splash .wc{position:absolute;left:0;right:0;margin:0 auto;top:calc(50% + 84px);width:min(320px,78vw);animation:in .9s .35s both}
#splash p{position:absolute;left:0;right:0;top:calc(50% + 275px);margin:0;letter-spacing:.3em;font-size:14px;color:#d9b866;font-weight:600;animation:in .9s .7s both}
.event{margin:0 0 10px;color:var(--ac);font-weight:600;letter-spacing:.12em;font-size:13px;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===== premium gold theme ===== */
:root{--bg:#0a0907;--bg2:#15130f;--card:rgba(255,240,210,.035);--bd:rgba(212,175,106,.16);--tx:#f5efe3;--mut:#a39a88;--ac:#d4af6a;--ac2:#f0d9a0;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Serif Telugu","Noto Sans Telugu","Nirmala UI",serif}
[data-theme=light]{--bg:#f7f2e8;--bg2:#fffdf8;--card:rgba(90,60,10,.04);--bd:rgba(120,85,20,.2);--tx:#1c1710;--mut:#7a705e;--ac:#9a7424;--ac2:#b8902f}
body{background-image:radial-gradient(70vw 45vh at 50% -10%,color-mix(in srgb,var(--ac) 16%,transparent),transparent)}
.brand{background:none;-webkit-text-fill-color:currentColor;color:var(--ac);font-family:var(--serif);letter-spacing:.2em;display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px;border-radius:8px}
#share{border-color:var(--ac);color:var(--ac)}
.ib{border-radius:12px}
.hero{padding:22px 0 4px}

.hero .yr{margin:14px 0 0;letter-spacing:.4em;font-size:13px;color:var(--ac);font-weight:600}

h2{font-family:var(--serif);font-weight:600;font-size:27px;display:flex;align-items:baseline;gap:12px;margin:38px 0 8px}
h2 small{font-family:var(--sans);font-size:13px;color:var(--mut);font-weight:500;letter-spacing:.04em}
.grid{counter-reset:n;grid-template-columns:1fr!important;gap:0}
@media(min-width:1100px){.grid{grid-template-columns:1fr 1fr!important;column-gap:48px}}
.card{counter-increment:n;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:none;padding:14px 4px;gap:14px}
.card:hover{transform:none;background:var(--card);box-shadow:none}
.card::before{content:counter(n,decimal-leading-zero);font-family:var(--serif);color:var(--ac);font-size:18px;width:26px;flex:none;opacity:.85}
.art{width:56px;height:56px;border-radius:12px;font-family:var(--serif);font-size:24px}
.meta b{font-size:19px;font-weight:600}
.meta i{color:var(--ac);text-transform:uppercase;letter-spacing:.14em;font-size:11px}
.rh h1{font-family:var(--serif)}
.ly{font-family:var(--serif);font-size:clamp(20px,5vw,25px)}
.ly p{padding-left:18px;border-left:2px solid color-mix(in srgb,var(--ac) 35%,transparent)}
.tabs button.on{background:var(--ac);color:#0a0907;font-weight:600}
.sb{border-radius:16px}
.hero .panel p{max-width:none;margin-left:auto;margin-right:auto;text-align:center}
.hero .panel img{display:block;margin:0 auto}
</style>
</head>
